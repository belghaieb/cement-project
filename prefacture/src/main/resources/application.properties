
groq.api.key=YOUR_GROQ_API_KEY_HERE
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=qwen/qwen3.6-27b
spring.application.name=prefacture

server.port=8080

# --- Base de donnees MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/prefacture?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Upload de fichiers (photos + scans) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Cookie de session ---
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/

# --- Stockage photos + import Sage ---
app.upload-dir=./data/photos
app.sage-import.path=./data/sage/export.xlsx
app.sage-import.enabled=true
app.sage-import.cron=0 0 */8 * * *

# --- OCR ---
ocr.tesseract.data-path=C:/Program Files/Tesseract-OCR/tessdata
ocr.tesseract.language=fra

# --- Gemini (second avis OCR) ---
